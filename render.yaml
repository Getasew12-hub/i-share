services:
  - type: static_site
    name: i-share-client
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: i-share-server
    runtime: node
    buildCommand: npm ci && npm run prisma:generate --workspace server && npm run build --workspace server
    preDeployCommand: npm run prisma:migrate:deploy --workspace server
    startCommand: npm run start --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: EMAIL_VERIFICATION_TOKEN_TTL_HOURS
        value: 24